#nameScore{font:700 26px 'Courier New',monospace;color:#ffb347;margin:6px 0 4px}
#nameInput{font:900 44px 'Courier New',monospace;width:4.4ch;text-align:center;text-transform:uppercase;background:#000;color:#ff9a1f;border:2px solid #ff9a1f;border-radius:8px;padding:4px 8px;letter-spacing:6px;outline:none}
#nameOk{margin-top:14px;font:800 18px system-ui;padding:10px 26px;border:0;border-radius:8px;background:#ff9a1f;color:#111;cursor:pointer}

<body>
<div id="wrap"><canvas id="c" tabindex="0"></canvas></div>
<button id="fsBtn">⛶ Vollbild</button>
<div id="punchL" class="punch L"><svg viewBox="0 0 100 100"><rect x="30" y="66" width="40" height="26" rx="7" fill="#f2f2f2" stroke="#1a1020" stroke-width="4"/><ellipse cx="52" cy="42" rx="32" ry="33" fill="#d62828" stroke="#1a1020" stroke-width="4"/><ellipse cx="24" cy="55" rx="12" ry="18" transform="rotate(-25 24 55)" fill="#d62828" stroke="#1a1020" stroke-width="4"/><ellipse cx="42" cy="26" rx="11" ry="7" transform="rotate(-30 42 26)" fill="rgba(255,255,255,.45)"/></svg>SCHLAG</div>
<div id="punchR" class="punch R"><svg viewBox="0 0 100 100"><rect x="30" y="66" width="40" height="26" rx="7" fill="#f2f2f2" stroke="#1a1020" stroke-width="4"/><ellipse cx="52" cy="42" rx="32" ry="33" fill="#d62828" stroke="#1a1020" stroke-width="4"/><ellipse cx="24" cy="55" rx="12" ry="18" transform="rotate(-25 24 55)" fill="#d62828" stroke="#1a1020" stroke-width="4"/><ellipse cx="42" cy="26" rx="11" ry="7" transform="rotate(-30 42 26)" fill="rgba(255,255,255,.45)"/></svg>SCHLAG</div>

<div id="nameBox"><div class="card">
  <h2>NEUER HIGHSCORE!</h2>
  <div id="nameScore"></div>
  <p>Deine Initialen (3 Zeichen):</p>
  <input id="nameInput" maxlength="3" autocomplete="off" spellcheck="false"><br>
  <button id="nameOk">EINTRAGEN</button>

<script>
(()=>{
'use strict';
const W=800,H=600,TAU=Math.PI*2,R=115,INK='#1a1020';
const cv=document.getElementById('c');
let ctx=cv.getContext('2d');
const IS_TOUCH=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
let scale=1,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  scale=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=(W*scale)+'px';cv.style.height=(H*scale)+'px';
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);
}
window.addEventListener('resize',resize);resize();

/* ================= Helfer ================= */
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function hexToRgb(h){h=h.replace('#','');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function mix(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,TAU);}
function circ(x,y,r){ell(x,y,r,r);}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fs(fill,stroke,lw){if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.stroke();}}
function inRect(r,x,y){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}

/* ================= Speicher ================= */
let mode='leis';
const HS_KEYS={leis:'btl_hs_v1',carla:'btl_hs_carla_v1'},INV_KEY='btl_inv_v1';
let memHS={},memInv=null;
function defaultHS(m){return m==='carla'?[{n:'CAR',s:20000},{n:'HUH',s:12000},{n:'PFA',s:8000},{n:'MIX',s:4000},{n:'EI!',s:1500}]:[{n:'LEI',s:20000},{n:'BTL',s:12000},{n:'KAT',s:8000},{n:'C64',s:4000},{n:'BOX',s:1500}];}
function loadHS(m){m=m||mode;try{const r=localStorage.getItem(HS_KEYS[m]);if(r){const a=JSON.parse(r);if(Array.isArray(a)&&a.length)return a;}}catch(e){}return memHS[m]||defaultHS(m);}
function saveHS(a){memHS[mode]=a;hsCache=a;try{localStorage.setItem(HS_KEYS[mode],JSON.stringify(a));}catch(e){}}
let hsCache=loadHS('leis');
const THEME={
  leis:{acc:'#ff9a1f',led:'#ff9a1f',glow:'#ff7a00',ghost:'rgba(255,120,0,0.12)',b1:'#e8302a',b2:'#ffe14d',title:'BEAT THE LEIS',sub:'– BTL –',laugh:'HA – HA – HA!',he:'ER'},
  carla:{acc:'#ff5fb0',led:'#ff7ad9',glow:'#ff2aa8',ghost:'rgba(255,60,180,0.13)',b1:'#c42bd6',b2:'#ffd1f0',title:'BEAT CARLA',sub:'– DIE KÜCHENSCHLACHT –',laugh:'HI – HI – HI!',he:'SIE'}
};
const TH=()=>THEME[mode];
function loadInv(){try{const r=localStorage.getItem(INV_KEY);if(r){const o=JSON.parse(r);if(o&&typeof o.s==='number'&&typeof o.k==='number')return o;}}catch(e){}return memInv||{s:0,k:0};}
let inv=loadInv();
function saveInv(){memInv={s:inv.s,k:inv.k};try{localStorage.setItem(INV_KEY,JSON.stringify(inv));}catch(e){}}
const invTotal=()=>inv.s+inv.k;

/* ================= Sound (C64-Stil, synthetisch) ================= */
let AC=null,master=null,musicGain=null,sfxGain=null,muted=false,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=muted?0:0.6;master.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=0.32;musicGain.connect(master);
  sfxGain=AC.createGain();sfxGain.gain.value=1;sfxGain.connect(master);
  const len=Math.floor(AC.sampleRate*2);noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
}
function toggleMute(){muted=!muted;initAudio();if(master)master.gain.setValueAtTime(muted?0:0.6,AC.currentTime);}
function voice(type,f0,t,dur,vol,o){
  if(!AC)return;o=o||{};
  const osc=AC.createOscillator(),g=AC.createGain();osc.type=type;osc.frequency.setValueAtTime(f0,t);
  if(o.to)osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.to),t+(o.slide||dur));
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vibF||6;lg.gain.value=o.vib;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+dur+0.05);}
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(o.a||0.005));
  if(o.hold){g.gain.setValueAtTime(vol,t+Math.max(0.01,dur-0.04));}
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let node=osc;
  if(o.filter){const f=AC.createBiquadFilter();f.type=o.filter;f.frequency.value=o.ff||1000;f.Q.value=o.q||1;osc.connect(f);node=f;}
  node.connect(g);g.connect(o.dest||sfxGain);osc.start(t);osc.stop(t+dur+0.05);
}
function noise(dur,vol,o){
  if(!AC)return;o=o||{};const t=o.t!=null?o.t:AC.currentTime;
  const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=o.type||'lowpass';fl.Q.value=o.q||1;
  fl.frequency.setValueAtTime(o.f0||2000,t);if(o.f1)fl.frequency.exponentialRampToValueAtTime(o.f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(o.dest||sfxGain);s.start(t);s.stop(t+dur+0.05);
}
const now=()=>AC?AC.currentTime:0;
const mid=m=>440*Math.pow(2,(m-69)/12);
function laughVoice(actx,dest,base,deep,carla){
  const nb=actx.createBuffer(1,Math.floor(actx.sampleRate*0.3),actx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const curve=new Float32Array(256);for(let k=0;k<256;k++){const x=k/128-1;curve[k]=Math.round(x*10)/10;}
  const syl=carla?[[0,440],[0.12,425],[0.24,412],[0.36,400],[0.48,388],[0.6,376],[0.74,350]]:[[0,240],[0.16,228],[0.32,216],[0.48,204],[0.64,192],[0.82,172]];
  const FORM=carla?[[330,6,1.0],[2300,8,0.9],[3000,9,0.45]]:[[730,5,1.0],[1100,6,0.75],[2450,7,0.35]];
  syl.forEach(([dt,f],i)=>{
    const t=base+dt,dur=i===syl.length-1?(carla?0.45:0.6):(carla?0.11:0.15),f0=f*deep;
    const ns=actx.createBufferSource();ns.buffer=nb;const nf=actx.createBiquadFilter();nf.type='bandpass';nf.frequency.value=1500;nf.Q.value=0.8;
    const ng=actx.createGain();ng.gain.setValueAtTime(0.0001,t);ng.gain.exponentialRampToValueAtTime(0.5,t+0.01);ng.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    ns.connect(nf);nf.connect(ng);ng.connect(dest);ns.start(t);ns.stop(t+0.1);
    const o=actx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0*1.12,t+0.03);o.frequency.exponentialRampToValueAtTime(f0*0.8,t+dur);
    const sum=actx.createGain();
    FORM.forEach(([fr,q,a])=>{const bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=fr*(deep<1?0.93:1);bp.Q.value=q;const ga=actx.createGain();ga.gain.value=a*3.5;o.connect(bp);bp.connect(ga);ga.connect(sum);});
    const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;const lg=actx.createGain();lg.gain.value=0.3;o.connect(lp);lp.connect(lg);lg.connect(sum);
    const ws=actx.createWaveShaper();ws.curve=curve;
    const g=actx.createGain();g.gain.setValueAtTime(0.0001,t+0.03);g.gain.exponentialRampToValueAtTime(0.85,t+0.05);g.gain.setValueAtTime(0.85,t+dur*0.6);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    sum.connect(ws);ws.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.05);
  });
}
const SFX={
  punch(big){const t=now();noise(0.2,big?1:0.55,{f0:2600,f1:250});voice('sine',big?170:140,t,0.24,big?1:0.6,{to:38});if(big)voice('square',95,t,0.28,0.22,{to:30});},
  block(){const t=now();noise(0.08,0.5,{type:'highpass',f0:2200});voice('square',430,t,0.07,0.14,{to:210});voice('triangle',190,t,0.1,0.3,{to:120});},
  whoosh(){noise(0.2,0.28,{type:'bandpass',f0:600,f1:2600,q:2});},
  bell(){const t=now();[0,0.45].forEach(d=>{voice('sine',1046,t+d,1.3,0.3);voice('sine',1568,t+d,0.9,0.13);voice('sine',2637,t+d,0.5,0.05);});},
  tick(){voice('square',1800,now(),0.025,0.05);},
  beep(f){voice('square',f||900,now(),0.09,0.12);},
  type(){voice('square',rand(1500,2200),now(),0.02,0.05);},
  load(){const t=now();for(let i=0;i<14;i++)voice('square',pick([600,900,1200,1800,2400]),t+i*0.07,0.05,0.04);},
  special(){const t=now();[523,659,784,1046,1318].forEach((f,i)=>voice('square',f,t+i*0.06,0.12,0.1));},
  bonus(){const t=now();[784,988,1175,1568].forEach((f,i)=>voice('square',f,t+i*0.07,0.1,0.11));},
  win(){const t=now();[523,659,784,1046,784,1046].forEach((f,i)=>voice('square',f,t+i*0.09,0.14,0.1,{vib:4}));voice('triangle',131,t,0.6,0.3);},
  fail(){const t=now();[392,370,349,330].forEach((f,i)=>voice('square',f,t+i*0.16,0.2,0.1,{vib:6}));},
  gameover(){const t=now();[659,622,587,554,523].forEach((f,i)=>voice('square',f,t+i*0.28,i===4?1.0:0.26,0.11,{vib:5}));[165,156,147,139,131].forEach((f,i)=>voice('triangle',f,t+i*0.28,0.28,0.3));},
  slide(){voice('sine',1400,now(),1.1,0.3,{to:170});},
  crowd(dur,v){dur=dur||2.5;v=v||0.35;noise(dur,v,{type:'bandpass',f0:900,f1:1400,q:0.6});noise(dur*0.8,v*0.6,{type:'bandpass',f0:2200,f1:1800,q:0.8});},
  count(){voice('triangle',320,now(),0.12,0.3);},
  boing(){const t=now();voice('sine',200,t,0.12,0.3,{to:620});voice('sine',620,t+0.12,0.3,0.25,{to:150});},
  tooth(){const t=now();voice('sine',2400,t,0.08,0.12,{to:3200});voice('sine',3000,t+0.08,0.1,0.08,{to:2000});},
  donk(){const t=now();voice('sine',320,t,0.25,0.6,{to:110});noise(0.12,0.5,{f0:900});voice('square',160,t,0.1,0.15,{to:90});},
  miau(){if(!AC)return;const t=now();const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(420,t);o.frequency.linearRampToValueAtTime(760,t+0.18);o.frequency.linearRampToValueAtTime(480,t+0.55);
    const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(700,t);f.frequency.linearRampToValueAtTime(1900,t+0.2);f.frequency.linearRampToValueAtTime(800,t+0.55);
    const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.7,t+0.05);g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);o.connect(f);f.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+0.65);},
  swish(){noise(0.15,0.2,{type:'bandpass',f0:2500,f1:800,q:2});},
  charge(){const t=now();voice('sawtooth',110,t,1.4,0.18,{to:880,filter:'lowpass',ff:1600});noise(1.4,0.25,{type:'bandpass',f0:300,f1:3000,q:1.5});},
  laugh(st){if(AC)laughVoice(AC,sfxGain,now()+0.02,mode==='carla'?(st>=4?0.85:st>=2?0.93:1):(st>=4?0.78:st>=2?0.9:1.05),mode==='carla');},
  dong(){const t=now();[523,1320,2100].forEach((f,i)=>voice('sine',f,t,1.0-i*0.25,0.28/(i+1)));noise(0.05,0.4,{type:'highpass',f0:3000});},
  klonk(){const t=now();[180,410,770].forEach((f,i)=>voice('triangle',f,t,0.4,0.4/(i+1)));noise(0.08,0.5,{f0:1200});},
  tock(){const t=now();voice('triangle',700,t,0.08,0.4,{to:400});noise(0.04,0.3,{type:'bandpass',f0:1800,q:3});},
  tsching(){const t=now();[2400,3100,3900].forEach((f,i)=>voice('square',f,t+i*0.012,0.25,0.04));},
  surr(){voice('sawtooth',90,now(),0.6,0.2,{to:150,vib:20,vibF:30,filter:'lowpass',ff:1200});},
  wusch(){noise(0.6,0.45,{type:'bandpass',f0:400,f1:2500,q:1.2});voice('sawtooth',120,now(),0.6,0.1,{to:220});},
  puff(){noise(0.18,0.45,{f0:800,f1:200});},
  splat(){noise(0.2,0.6,{f0:1500,f1:300});voice('sine',300,now(),0.15,0.3,{to:80});},
  boinng(){const t=now();voice('sine',220,t,1.6,0.6,{vib:18,vibF:7});voice('triangle',660,t,1.0,0.22,{vib:30,vibF:7});voice('sine',1500,t,0.5,0.1);noise(0.08,0.7,{f0:2000});},
  gack(){const t=now();[0,0.12,0.22].forEach((d,i)=>voice('square',900+i*150,t+d,0.08,0.1,{to:1300,filter:'bandpass',ff:1500,q:3}));voice('square',700,t+0.34,0.32,0.12,{to:1150,filter:'bandpass',ff:1400,q:3});},
  off(){voice('sine',1400,now(),0.45,0.25,{to:50});noise(0.3,0.2,{type:'highpass',f0:4000});}
};

/* ---- Titelmusik: kleiner Sequencer ---- */
const CHORDS_L=[{root:45,arp:[57,60,64]},{root:41,arp:[53,57,60]},{root:48,arp:[55,60,64]},{root:43,arp:[55,59,62]}];
const MEL_L=[
  [[0,69,3],[3,72,3],[6,76,2],[8,74,2],[10,72,2],[12,69,4]],
  [[0,65,3],[3,69,3],[6,72,2],[8,74,4],[12,72,4]],
  [[0,67,3],[3,72,3],[6,76,2],[8,79,4],[12,76,2],[14,74,2]],
  [[0,74,2],[2,72,2],[4,71,2],[6,67,2],[8,71,4],[12,74,4]]
];
const SONGS={leis:{bpm:138,chords:CHORDS_L,mel:MEL_L},carla:{bpm:150,chords:[{root:48,arp:[60,64,67]},{root:43,arp:[59,62,67]},{root:45,arp:[57,60,64]},{root:41,arp:[57,60,65]}],mel:[
  [[0,72,2],[2,76,2],[4,79,2],[6,76,2],[8,77,2],[10,76,2],[12,74,4]],
  [[0,74,2],[2,79,2],[4,83,2],[6,79,2],[8,81,4],[12,79,4]],
  [[0,76,2],[2,72,2],[4,76,2],[6,81,2],[8,79,2],[10,77,2],[12,76,4]],
  [[0,77,2],[2,76,2],[4,74,2],[6,72,2],[8,74,2],[10,76,2],[12,72,4]]]}};
let musicTimer=null,musicNext=0,musicStep=0;
function startMusic(){if(!AC||musicTimer)return;musicGain.gain.cancelScheduledValues(now());musicGain.gain.setValueAtTime(0.32,now());musicStep=0;musicNext=now()+0.1;musicTimer=setInterval(schedMusic,40);schedMusic();}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}if(musicGain){const t=now();musicGain.gain.cancelScheduledValues(t);musicGain.gain.setValueAtTime(0,t);}}
function schedMusic(){
  if(!AC)return;
  while(musicNext<now()+0.25){
    const SG=SONGS[mode],STEP=60/SG.bpm/4,step=musicStep,t=musicNext,bar=Math.floor(step/16)%4,st=step%16,pass=Math.floor(step/64)%2,ch=SG.chords[bar];
    for(let k=0;k<2;k++){const n=ch.arp[(st*2+k)%3]+(pass?12:0);voice('square',mid(n),t+k*STEP/2,STEP/2*0.92,0.045,{dest:musicGain,hold:true});}
    if([0,3,6,8,11,14].includes(st))voice('triangle',mid(ch.root+(st%2?12:0)),t,STEP*1.7,0.42,{dest:musicGain});
    if(st===0||st===8)voice('sine',150,t,0.13,0.7,{to:40,dest:musicGain});
    if(st===4||st===12)noise(0.1,0.35,{type:'highpass',f0:1800,t,dest:musicGain});
    if(st%2===1)noise(0.03,0.08,{type:'highpass',f0:7000,t,dest:musicGain});
    for(const [s0,n,l] of SG.mel[bar])if(s0===st)voice(pass||mode==='carla'?'square':'sawtooth',mid(n),t,l*STEP*0.95,0.1,{dest:musicGain,vib:4,vibF:6,hold:true,filter:'lowpass',ff:2600});
    musicNext+=STEP;musicStep++;
  }
}

function miniAction(){
  if(mini.phase==='intro'){if(stateT>0.3)miniBegin();return;}
  if(mini.phase==='play'){if(MINI[mini.type].action)MINI[mini.type].action(mini);return;}
  if(mini.phase==='result'&&mini.t>0.5){if(mini.ok&&!mini.full)return;startRound();}
}
function miniClick(x,y){
  if(mini.phase==='result'&&mini.ok&&!mini.full&&mini.t>0.4){for(const b of REWARD_BTNS)if(inRect(b,x,y)){miniReward(b.k);return true;}return true;}
  if(mini.phase==='play'&&MINI[mini.type].click)return MINI[mini.type].click(mini,x,y);
  return false;
}
function miniKey(e){
  const k=e.key;
  if(mini.phase==='result'&&mini.ok&&!mini.full&&mini.t>0.4){if(k==='1'||k.toLowerCase()==='s'){miniReward('s');return true;}if(k==='2'||k.toLowerCase()==='k'){miniReward('k');return true;}return false;}
  if(mini.phase==='play'&&MINI[mini.type].key)return MINI[mini.type].key(mini,e);

  }

/* ================= Update ================= */
function update(rdt){
  time+=rdt;stateT+=rdt;
  const dt=cine?rdt*0.2:rdt;
  for(let i=timers.length-1;i>=0;i--){timers[i].t-=rdt;if(timers[i].t<=0){const f=timers[i].fn;timers.splice(i,1);f();}}
  head.vx+=(-180*head.x-11*head.vx)*dt;head.x+=head.vx*dt;
  head.vy+=(-180*head.y-11*head.vy)*dt;head.y+=head.vy*dt;
  head.vr+=(-130*head.r-10*head.vr)*dt;head.r+=head.vr*dt;
  shake=Math.max(0,shake-60*rdt);flashA=Math.max(0,flashA-rdt*2.5);hurtV=Math.max(0,hurtV-rdt*1.2);
  flinch-=dt;oppBlockT-=dt;bar.markT-=rdt;
  if(gl){gl.t+=dt;if(gl.t>=gl.dur)gl=null;}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;if(p.t>=p.life){particles.splice(i,1);continue;}
    if(p.type==='star'||p.type==='heart'){p.vx*=0.96;p.vy*=0.96;}else p.vy+=({tooth:900,curler:800,flour:-20}[p.type]||600)*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
  for(let i=texts.length-1;i>=0;i--){texts[i].t+=dt;if(texts[i].t>=texts[i].dur)texts.splice(i,1);}
  for(let i=flashes.length-1;i>=0;i--){flashes[i].t+=rdt;if(flashes[i].t>0.25)flashes.splice(i,1);}
  if(state!==S.BOOT&&state!==S.LOAD&&Math.random()<(state===S.WIN?0.5:0.03))flashes.push({x:rand(10,790),y:rand(140,300),t:0});
  if(shownScore<score){shownScore=Math.min(score,shownScore+Math.max(10,Math.ceil((score-shownScore)*6*rdt)));tickAcc+=rdt;if(tickAcc>0.045){tickAcc=0;SFX.tick();}}
  lagHP=lagHP>oppHP?Math.max(oppHP,lagHP-50*rdt):oppHP;
  switch(state){
    case S.LOAD:updateLoad(rdt);break;
    case S.TITLE:updateTitle(rdt);break;
    case S.MINI:updateMini(rdt);break;
    case S.INTRO:if(stateT>=3.2){state=S.PLAY;stateT=0;}break;
    case S.PLAY:if(cine)updateCine(rdt);if(state===S.PLAY)updatePlay(dt);break;
    case S.WIN:if(stateT>=4.2){level++;startMini();}break;
    case S.LOSE:updateLose();break;
  }
}
function updatePlay(dt){
  const L=LVc();
  fightT+=dt;timeLeft-=dt;
  const sec=Math.ceil(timeLeft);if(sec!==lastSec){lastSec=sec;if(sec<=10&&sec>0)SFX.beep(sec<=3?1300:900);}
  if(L.ultra){kond-=1.5*dt;oppHP=Math.min(100,oppHP+3*dt);if(fightT>=ultraKO)koDrain=true;if(koDrain)kond-=55*dt;}
  if(L.trick>=3){jerkT-=dt;if(jerkT<=0){jerkT=rand(1.8,3.5);head.vx+=pick([-1,1])*rand(150,260);}}
  if(!cine){
    if(bar.cool>0){bar.cool-=dt;if(bar.cool<=0)newSweep();}
    else{
      bar.p+=bar.dir*sweepSpeed()*dt;
      if(bar.rev&&bar.dir<0&&bar.p<=bar.rev.at)bar.dir=1;
      else if(bar.rev&&bar.dir>0&&bar.p>=bar.rev.at+bar.rev.back){bar.dir=-1;bar.rev=null;}
      if(bar.p<=0)newSweep();
    }
  }
  if(kond<=0){kond=0;lose('KEINE PUSTE MEHR!');}
  else if(timeLeft<=0){timeLeft=0;lose('ZEIT UM!');}
}
function updateLose(){
  if(!koImpact&&stateT>=1.25){koImpact=true;SFX.punch(true);if(mode==='carla'){SFX.boinng();popText('BOINNNG!',400,180,'#ffe14d',60,true);}else{SFX.donk();after(0.25,SFX.boing);}flashC='255,255,255';flashA=1;shake=40;makeCrack();}
  if(stateT>=2.4){const n=Math.min(10,Math.floor((stateT-2.4)/0.33)+1);if(n>countN){countN=n;SFX.count();if(n===10){SFX.bell();after(0.6,SFX.gameover);after(1.6,()=>SFX.laugh(curStage()));}}}
  if(stateT>=7.6&&!koDone){koDone=true;finishGame();}
}

function confirmYes(){const k=confirmQ;confirmQ=null;if(k==='abort'){timers=[];cine=null;superArmed=false;gl=null;crack=null;goTitle();}else if(k==='quit')powerOff();}
function confirmNo(){confirmQ=null;}
function powerOff(){stopMusic();SFX.off();state=S.OFF;stateT=0;timers=[];texts=[];catMode=false;cat=null;}

  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);panel(170,200,460,220);

}

  else if(t<0.5){const w=lerp(W,6,easeIn((t-0.25)/0.25));ctx.fillStyle='#ffffff';ctx.fillRect(400-w/2,298,w,4);}

function draw(){
  drawMain();

}
function drawMain(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);ctx.clearRect(0,0,W,H);
  if(state===S.OFF){drawOff();return;}
  if(state===S.BOOT||state===S.LOAD){drawBoot();return;}
  if(state===S.TITLE){drawTitle();ctx.font='20px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(muted?'🔇':'🔊',muteRect.x+20,muteRect.y+15);if(flashA>0){ctx.fillStyle=`rgba(${flashC},${flashA})`;ctx.fillRect(0,0,W,H);}return;}
  if(state===S.MINI){drawMini();if(paused)drawStateOverlay();return;}
  ctx.save();

  if(shake>0){cx=rand(-shake,shake);cy=rand(-shake,shake);}

  ctx.translate(400+cx,300+cy);ctx.rotate(cr);ctx.translate(-400,-300);
  drawBG();drawOpponent();drawParticles();drawPlayerGloves();drawCine();drawLoseGlove();drawTexts();

  if(state===S.PLAY&&kond<25){const a=0.18+0.12*Math.sin(time*6);const g=ctx.createRadialGradient(400,300,200,400,300,520);g.addColorStop(0,'rgba(200,0,0,0)');g.addColorStop(1,`rgba(200,0,0,${a})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  if(flashA>0){ctx.fillStyle=`rgba(${flashC},${flashA})`;ctx.fillRect(0,0,W,H);}

function frame(t){
  const rdt=Math.min(0.05,(t-lastFrame)/1000);lastFrame=t;
  if(!paused&&!confirmQ)update(rdt);else time+=rdt;
  lastUpd=performance.now();
  draw();updateTouchUI();requestAnimationFrame(frame);
}
let lastFrame=performance.now();
requestAnimationFrame(frame);

/* ================= Eingabe ================= */
function onAction(){
  initAudio();
  if(nameOpen)return;
  if(confirmQ)return;
  if(state===S.OFF){if(stateT>1){state=S.BOOT;stateT=0;}return;}
  if(paused){paused=false;return;}
  switch(state){
    case S.BOOT:startLoad();return;
    case S.LOAD:if(loadT>0.3){loadTyped=0;goTitle();}return;
    case S.TITLE:if(catMode){catMode=false;cat=null;titleIdle=0;return;}startGame();return;
    case S.MINI:miniAction();return;
    case S.PLAY:fightClick();return;
    case S.SCORES:if(stateT>0.8)goTitle();return;
  }
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();try{window.focus();cv.focus({preventScroll:true});}catch(err){}initAudio();titleIdle=0;
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(confirmQ){if(inRect(YES_BTN,x,y))confirmYes();else if(inRect(NO_BTN,x,y))confirmNo();return;}
  if(state!==S.BOOT&&state!==S.LOAD&&state!==S.OFF&&inRect(muteRect,x,y)){toggleMute();return;}
  if(state===S.MINI&&mini.phase!=='result'&&inRect(skipRect,x,y)){paused=false;skipMini();return;}
  if((state===S.PLAY||state===S.INTRO)&&inRect(closeRect,x,y)){paused=false;askConfirm('abort');return;}
  if(state===S.TITLE){if(catMode&&cat){catMode=false;cat=null;titleIdle=0;return;}if(inRect(START_BTN,x,y)){startGame();return;}for(const b of SEL_BTNS)if(inRect(b,x,y)){if(b.m===mode)startGame();else setMode(b.m);return;}if(inRect(QUIT_BTN,x,y)){askConfirm('quit');return;}}
  if(paused){paused=false;return;}
  if(state===S.PLAY){if(inRect(BTN_S,x,y)){useBonus('s');return;}if(inRect(BTN_K,x,y)){useBonus('k');return;}}
  if(state===S.MINI&&miniClick(x,y))return;
  onAction();
});
window.addEventListener('keydown',e=>{
  if(nameOpen){if(e.key==='Enter'){e.preventDefault();submitName();}return;}
  initAudio();titleIdle=0;
  const k=e.key.toLowerCase();
  if(confirmQ){if(k==='j'||k==='y'||k==='enter'){e.preventDefault();confirmYes();}else if(k==='n'||k==='escape'){e.preventDefault();confirmNo();}return;}
  if(k==='escape'||(e.ctrlKey&&k==='c')){e.preventDefault();
    if(state===S.MINI){paused=false;skipMini();}
    else if(state===S.PLAY||state===S.INTRO||state===S.WIN){paused=false;askConfirm('abort');}
    else if(state===S.TITLE)askConfirm('quit');
    return;}
  if(state===S.OFF){onAction();return;}
  if(state===S.TITLE){if(k==='arrowleft'||k==='1'){setMode('leis');return;}if(k==='arrowright'||k==='2'){setMode('carla');return;}}
  if(k==='m'&&state!==S.MINI){toggleMute();return;}
  if(k==='p'&&(state===S.PLAY||state===S.MINI)){paused=!paused;return;}
  if(paused){if(e.code==='Space'){e.preventDefault();paused=false;}return;}
  if(state===S.MINI&&!e.repeat&&miniKey(e))return;
  if(e.code==='Space'||k==='enter'){e.preventDefault();if(!e.repeat)onAction();return;}
  if(state===S.PLAY){if(k==='s')useBonus('s');else if(k==='k')useBonus('k');return;}
  if(state===S.BOOT)onAction();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state===S.PLAY||state===S.MINI))paused=true;});

/* ================= Handy: Daumentasten, Vollbild ================= */
const punchL=document.getElementById('punchL'),punchR=document.getElementById('punchR'),thumbS=document.getElementById('thumbS'),thumbK=document.getElementById('thumbK'),fsBtn=document.getElementById('fsBtn');
let tuiCache='';
function updateTouchUI(){
  if(!IS_TOUCH)return;
  const m=(window.innerWidth-W*scale)/2,show=state===S.PLAY&&m>=64&&!confirmQ&&!paused;
  const fsShow=state===S.TITLE&&document.fullscreenEnabled&&!document.fullscreenElement&&!(window.matchMedia&&matchMedia('(display-mode: fullscreen)').matches);
  const key=[show,fsShow,Math.round(m),inv.s,inv.k,bonusUsed,superArmed,window.innerHeight,mode].join('|');
  if(key===tuiCache)return;tuiCache=key;
  fsBtn.style.display=fsShow?'block':'none';
  const IH=window.innerHeight,w=Math.min(m-14,140),ps=Math.min(w,IH*0.46);

    el.style.left=(left?(m-ps)/2:window.innerWidth-m+(m-ps)/2)+'px';el.style.borderColor=TH().acc;
  }

    if(!show){el.style.display='none';continue;}

    el.style.left=(k==='s'?(m-w)/2:window.innerWidth-m+(m-w)/2)+'px';
    el.style.background=ok?col:'#3a3044';el.style.opacity=ok?'1':'0.6';el.querySelector('b').textContent=bonusUsed?'BENUTZT':'× '+n;
  }
}
for(const [el,sd] of [[punchL,0],[punchR,1]])el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();initAudio();if(state===S.PLAY&&!confirmQ&&!paused)fightClick(sd);el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),110);});
for(const [el,k] of [[thumbS,'s'],[thumbK,'k']])el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();useBonus(k);tuiCache='';});
fsBtn.addEventListener('click',e=>{e.preventDefault();initAudio();const d=document.documentElement;try{const pr=d.requestFullscreen?d.requestFullscreen({navigationUI:'hide'}):null;if(pr&&pr.then)pr.then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(err){}}).catch(()=>{});}catch(err){}tuiCache='';});
document.getElementById('wrap').addEventListener('pointerdown',e=>{if(e.target.id==='wrap'&&state===S.PLAY&&!confirmQ&&!paused){e.preventDefault();initAudio();onAction();}});
document.addEventListener('fullscreenchange',()=>{tuiCache='';resize();});

/* Testzugang für automatische Prüfung */
window.__btl={setMode:(m)=>{mode=m;hsCache=loadHS(m);},confirm:(k)=>{confirmQ=k;},powerOff,get state(){return state;},get bar(){return bar;},get hp(){return oppHP;},set:(o)=>{if(o.level!=null)level=o.level;if(o.state!=null){state=o.state;stateT=o.stateT||0;}if(o.inv){inv=o.inv;}},S,startRound,startMini,lose,win,
  dmg:(o)=>Object.assign(dmg,o),setHp:(v)=>{oppHP=v;lagHP=v;},cat:()=>{catMode=true;catStart();},catT:(st,t)=>{cat.state=st;cat.t=t||0;},mini:()=>mini,cineStart:startCine,
  measure:async(which)=>{const oc=new OfflineAudioContext(1,44100*1.6,44100);laughVoice(oc,oc.destination,0.05,1);const buf=await oc.startRendering();const d=buf.getChannelData(0);let s2=0,m=0,n=0;for(let i=0;i<d.length;i++){const v=Math.abs(d[i]);if(v>m)m=v;if(v>0.01){s2+=d[i]*d[i];n++;}}return {peak:m,rms:Math.sqrt(s2/Math.max(1,n))};}};
})();
